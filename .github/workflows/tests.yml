name: tests
on:
  push:
    branches: [main, ubranch]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install numpy opencv-python-headless Pillow -r requirements-dev.txt
      - run: python -m pytest --cov=. --cov-report=term-missing
