name: lint
on:
  push:
    branches: [main, ubranch]
  pull_request:
    branches: [main, ubranch]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check . --select E9,F --exclude venv,.venv
